version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: safo
      POSTGRES_PASSWORD: safo_password
      POSTGRES_DB: safo_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safo -d safo_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
